name: MVP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Validate development version
        if: github.ref == 'refs/heads/dev'
        run: python tools/check_version.py --development
      - run: python tools/run_checks.py --fetch
