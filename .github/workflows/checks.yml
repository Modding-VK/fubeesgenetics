name: MVP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Install Lua if needed
        run: |
          if ! command -v lua5.4 >/dev/null 2>&1; then
            timeout 180s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
            timeout 120s sudo apt-get install -y lua5.4
          fi
      - name: Validate development version
        if: github.ref == 'refs/heads/dev'
        run: python tools/check_version.py --development
      - name: Validate release version
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')
        run: python tools/check_version.py --release
      - run: python tools/build_research_icons.py --check
      - run: python tools/run_checks.py --fetch
